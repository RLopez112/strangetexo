<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Mesh Gradient Skill</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #0f1011; /* Dark background matching the image */
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    position: relative;
  }

  .mesh-container {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    z-index: 0;
    overflow: hidden;
  }

  .shape {
    position: absolute;
    border-radius: 50%;
  }

  /* Orange/Gold Ellipse */
  .shape-1 {
    width: 60vw;
    height: 80vh;
    background-color: #FF8F00;
    filter: blur(150px);
    top: 50%;
    left: 60%;
    transform: translate(-50%, -50%) rotate(30deg);
    opacity: 0.6;
  }

  /* Light Blue/Cyan Shape */
  .shape-2 {
    width: 50vw;
    height: 60vh;
    background-color: #BFE4FF;
    filter: blur(130px);
    top: 10%;
    left: 20%;
    transform: translate(-50%, -50%);
    opacity: 0.4;
  }

  /* Subtle secondary orange */
  .shape-3 {
    width: 40vw;
    height: 50vh;
    background-color: #FF8F00;
    filter: blur(120px);
    bottom: -10%;
    left: 10%;
    opacity: 0.3;
  }
</style>
</head>
<body>
  <div class="mesh-container">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>
</body>
</html>
