<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strange Texo - Home</title>
<style>
  /* Reset and base styles */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #0f1011;
    color: #ffffff;
    overflow-x: hidden;
    min-height: 100vh;
    position: relative;
  }

  /* --- Mesh Gradient Background from Skill --- */
  .mesh-container {
    position: fixed;
    width: 100vw;
    height: 100vh;
    top: 0;
    left: 0;
    z-index: -1; /* Place it strictly behind the content */
    overflow: hidden;
  }

  .shape {
    position: absolute;
    border-radius: 50%;
  }

  .shape-1 {
    width: 60vw;
    height: 80vh;
    background-color: #FF8F00;
    filter: blur(150px);
    top: 50%;
    left: 60%;
    transform: translate(-50%, -50%) rotate(30deg);
    opacity: 0.6;
    animation: drift 20s infinite alternate ease-in-out;
  }

  .shape-2 {
    width: 50vw;
    height: 60vh;
    background-color: #BFE4FF;
    filter: blur(130px);
    top: 10%;
    left: 20%;
    transform: translate(-50%, -50%);
    opacity: 0.4;
    animation: float 25s infinite alternate ease-in-out;
  }

  .shape-3 {
    width: 40vw;
    height: 50vh;
    background-color: #FF8F00;
    filter: blur(120px);
    bottom: -10%;
    left: 10%;
    opacity: 0.3;
    animation: drift 22s infinite alternate-reverse ease-in-out;
  }

  /* Optional: Make the background feel dynamic */
  @keyframes drift {
    0% { transform: translate(-50%, -50%) rotate(30deg); }
    100% { transform: translate(-45%, -40%) rotate(45deg); }
  }

  @keyframes float {
    0% { transform: translate(-50%, -50%); }
    100% { transform: translate(-40%, -60%); }
  }

  /* --- Content Styling --- */
  .content {
    position: relative;
    z-index: 1; /* Content sits on top */
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 2rem;
  }

  .hero-glass {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    padding: 4rem;
    max-width: 800px;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
  }

  h1 {
    font-size: 4rem;
    font-weight: 800;
    margin-bottom: 1rem;
    letter-spacing: -0.05em;
    background: linear-gradient(135deg, #ffffff 0%, #b3b3b3 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  p {
    font-size: 1.25rem;
    line-height: 1.6;
    color: rgba(255, 255, 255, 0.8);
    margin-bottom: 2rem;
  }

  button {
    background: #ffffff;
    color: #0f1011;
    border: none;
    padding: 1rem 2rem;
    font-size: 1.1rem;
    font-weight: 600;
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(255, 255, 255, 0.15);
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Mesh Gradient Background applied as instructed by the skill -->
  <div class="mesh-container">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>

  <!-- Main Webpage Content -->
  <main class="content">
    <div class="hero-glass">
      <h1>Strange Texo</h1>
      <p>This is a stunning landing page built using the mesh gradient skill you developed. The beautifully blurred orange and cyan shapes create a premium, immersive aurora background.</p>
      <button>Get Started</button>
    </div>
  </main>

</body>
</html>
